'Putar roda dan taip peribahasa Jawi yang terpilih dalam Rumi. Setiap nombor hanya boleh dipilih sekali. Selesaikan 5 soalan dalam 2 minit 30 saat.'
];
function showIntro(i){let next=unlocked.findIndex(x=>!x);if(next<0)next=5;if(i>next)return;clearClocks();screen='intro';stage=i;base(`<div style="text-align:center;padding:20px 8px"><div style="font-size:60px">📜✨</div><h2>${NAMES[i]}</h2><h3>📖 Arahan Misi</h3><p style="font-size:19px;line-height:1.8;max-width:690px;margin:18px auto">${INSTRUCTIONS[i]}</p><p>Masa hanya bermula selepas anda menekan butang SEDIA.</p><button class="btn green" onclick="start(${i})">✅ SEDIA! MULAKAN MISI</button> <button class="btn pink" onclick="screen='map';render()">⬅ Peta</button></div>`)}
function start(i){startMusic();let next=unlocked.findIndex(x=>!x);if(next<0)next=4;if(i>next)return;clearClocks();stage=i;q=0;splitWord=0;splitTyped=[];answered=false;chosen=[];matched=[];recallMode=false;recallAnswers=[];recallMisses=0;recallFinished=false;left=null;spinning=false;wheelReady=false;timeoutHandled=false;screen='quiz';deadline=Date.now()+(stage===0?SPLIT_LIMIT:LIMIT)*1000;renderQuiz();tick=setInterval(()=>{updateTimer();if(stage===3&&!recallMode)drawMatchLines()},200);updateTimer()}
function shell(body){if(screen!=='quiz')return;base(`<div class="row between"><button class="btn pink" onclick="leave()">⬅ Peta</button><span class="pill">${stage===3?(recallMode?"Cabaran Ingatan":"Padanan 7 / 7"): `Soalan ${q+1} / ${stage===0?3:5}` }</span><span class="timer" id="timer">⏱️ ${timeLabel()}</span></div><h2 style="text-align:center">${NAMES[stage]}</h2><div class="progress"><div style="width:${q/(stage===0?3:5)*100}%"></div></div>${body}<div class="notice" id="msg" aria-live="polite"></div>`);updateTimer()}
function leave(){clearClocks();screen='map';render()}
function renderQuiz(){if(screen!=='quiz')return;if(stage===0){renderSplit();return}else if(stage===1){let x=BANK[0][q];let opts=[x.r,BANK[0][(q+2)%5].r,BANK[0][(q+3)%5].r];let offset=q%3;opts=opts.slice(offset).concat(opts.slice(0,offset));shell(`<p class="question">Apakah bacaan Rumi bagi peribahasa Jawi ini?</p><div class="jawi" lang="ms-Arab">${x.j}</div><div class="row">${opts.map(o=>`<button class="btn choice" onclick="answerRumi('${encodeURIComponent(o)}')">${escapeHTML(o)}</button>`).join('')}</div>`)}else if(stage===2){let x=BANK[1][q];let parts=x.j.split(' ');let shuffled=parts.map((p,i)=>({p,i})).sort((a,b)=>((a.i*3+q*2)%parts.length)-((b.i*3+q*2)%parts.length));if(shuffled.every((v,i)=>v.i===i))shuffled.reverse();shell(`<p class="question">Susun perkataan Jawi mengikut peribahasa yang betul.</p><p style="text-align:center">Petunjuk Rumi: <b>${escapeHTML(x.r)}</b></p><div class="slots" dir="rtl">${chosen.map((i,k)=>`<button class="slot jawi small" onclick="undo(${k})">${parts[i]}</button>`).join('')}${Array.from({length:parts.length-chosen.length},()=>'<span class="slot">❔</span>').join('')}</div><div class="row">${shuffled.map(({p,i})=>`<button class="btn choice jawi small" ${chosen.includes(i)?'disabled':''} onclick="pick(${i})">${p}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn pink" onclick="chosen=[];renderQuiz()">🔄 Padam</button><button class="btn green" ${chosen.length===parts.length?'':'disabled'} onclick="checkOrder()">✔ Semak</button></div>`)}else if(stage===3){if(recallMode){renderRecall();return}let d=MATCH_BANK,order=[2,6,4,1,5,3,0];shell(`<p class="question">Padankan setiap peribahasa Jawi dengan bacaan Ruminya.</p><p class="muted" style="text-align:center">Tarik garisan sendiri dari kotak Jawi di kiri ke padanan Rumi di kanan.</p><div class="match" id="matchBoard"><svg id="matchLines" class="match-lines"></svg><div>${d.map((x,i)=>`<button class="btn choice jawi small ${left===i?'sel':''} ${matched.includes(i)?'done':''}" ${matched.includes(i)?'disabled':''} data-left="${i}" onpointerdown="startMatchDrag(event,${i})">${x.j}</button>`).join('')}</div><div>${order.map(i=>`<button class="btn choice ${matched.includes(i)?'done':''}" ${matched.includes(i)?'disabled':''} data-right="${i}">${escapeHTML(d[i].r)}</button>`).join('')}</div></div><p style="text-align:center">Padanan tepat: ${matched.length}/7</p>`);requestAnimationFrame(drawMatchLines)}else{let x=wheelSelected===null?null:BANK[3][wheelSelected];shell(`<p class="question">Putar roda! Roda akan memilih hanya nombor yang belum digunakan.</p><div class="wheel-area"><div class="wheel-frame"><div class="pointer">▼</div><div class="wheel" id="wheel" style="transform:rotate(${wheelAngle}deg)"><div class="wheel-numbers">${[0,1,2,3,4].map(i=>`<span style="transform:translate(-50%,-50%) rotate(${i*72+36}deg) translateY(-115px) rotate(${-i*72-36}deg)">${wheelUsed.includes(i)?'':i+1}</span>`).join('')}</div><div class="wheel-center">🎡</div></div></div></div><div class="row"><button class="btn gold" id="spinBtn" ${spinning||wheelReady?'disabled':''} onclick="spinWheel()">${spinning?'🌀 Sedang berputar...':'🎡 PUTAR RODA'}</button></div><div id="wheelQuestion" class="${wheelReady?'':'hidden'}"><div class="jawi" lang="ms-Arab">${x?x.j:''}</div><div class="row"><input id="rumiInput" class="input" autocomplete="off" placeholder="Taip peribahasa dalam Rumi" onkeydown="if(event.key==='Enter')checkWheel()"></div><div class="row" style="margin-top:10px"><button class="btn green" onclick="checkWheel()">✔ Semak Jawapan</button></div></div>`)} }
function renderSplit(){let x=SPLIT[q],word=x.words[splitWord],target=x.letters[splitWord];shell(`<p class="question">Cerakinkan setiap huruf Jawi yang bersambung ke dalam kotak, satu demi satu.</p><p style="text-align:center">Peribahasa: <b>${escapeHTML(x.r)}</b></p><div class="jawi">${x.words.join(' ')}</div><div class="row">${x.words.map((w,i)=>`<span class="pill" style="${i===splitWord?'background:#ffe39c':''}">${i<splitWord?'✓ ':''}${w}</span>`).join('')}</div><h3 style="text-align:center">Perkataan ${splitWord+1}: <span class="jawi small">${word}</span></h3><div class="slots" dir="rtl">${target.map((_,i)=>`<button class="slot jawi small" onclick="removeSplit(${i})">${splitTyped[i]||'؟'}</button>`).join('')}</div><p class="muted" style="text-align:center">Tekan huruf pada papan kekunci Jawi mengikut turutan. Tekan kotak untuk memadam huruf.</p><div class="jawi-keyboard" dir="rtl">${KEYBOARD.map(k=>`<button class="key" onclick="addSplit('${k}')">${k}</button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn pink" onclick="splitTyped=[];renderSplit()">⌫ Padam Semua</button><button class="btn green" onclick="checkSplit()">✔ Semak Huruf</button></div>`)}
function addSplit(k){if(splitTyped.length>=SPLIT[q].letters[splitWord].length)return;splitTyped.push(k);beep(450,.05);renderSplit()}
function removeSplit(i){splitTyped.splice(i,1);renderSplit()}
function skipSplitTimeout(){
 if(screen!=='quiz'||stage!==0)return;
 score-=2;bad();answered=true;
 const oldQ=q;
 base(`<div style="text-align:center"><div style="font-size:75px">⏰</div><h2>Masa Peribahasa ${oldQ+1} Tamat!</h2><p>−2 markah. Peribahasa ini dilangkau.</p><p>${oldQ===2?'Misi 1 telah selesai.':'Bersedia untuk peribahasa seterusnya!'}</p></div>`);
 setTimeout(()=>{
  if(screen!=='quiz'||stage!==0||q!==oldQ)return;
  if(oldQ===2){unlocked[0]=true;clearClocks();screen='reward';render()}
  else{q++;splitWord=0;splitTyped=[];answered=false;timeoutHandled=false;deadline=Date.now()+SPLIT_LIMIT*1000;renderQuiz()}
 },1500);
}
function checkSplit(){let correct=SPLIT[q].letters[splitWord];if(splitTyped.join('')===correct.join('')){good();if(splitWord===SPLIT[q].words.length-1){next()}else{splitWord++;splitTyped=[];renderSplit()}}else penalty()}
function msg(t,ok){let e=$('#msg');if(e){e.textContent=t;e.className='notice '+(ok?'ok':'err')}}
function next(){if(answered||screen!=='quiz')return;answered=true;score+=10;good();if(q===(stage===0?2:4)){unlocked[stage]=true;clearClocks();setTimeout(()=>{screen='reward';render();good()},650)}else{setTimeout(()=>{q++;splitWord=0;splitTyped=[];chosen=[];answered=false;wheelReady=false;spinning=false;wheelSelected=null;if(stage===0){deadline=Date.now()+SPLIT_LIMIT*1000;timeoutHandled=false}renderQuiz()},550)}}
function answerRumi(encoded){if(answered||remaining()<=0)return;let v=decodeURIComponent(encoded);if(v===BANK[0][q].r){msg('🌟 Betul! '+BANK[0][q].m,true);next()}else{penalty()}}
function pick(i){if(answered||chosen.includes(i))return;chosen.push(i);beep(470,.06);renderQuiz()}function undo(k){if(answered)return;chosen.splice(k,1);renderQuiz()}function checkOrder(){if(answered)return;let x=BANK[1][q],parts=x.j.split(' ');if(chosen.length===parts.length&&chosen.every((v,i)=>parts[v]===parts[i])){msg('🌟 Susunan tepat!',true);next()}else{penalty()}}
function drawMatchLines(){let board=$('#matchBoard'),svg=$('#matchLines');if(!board||!svg)return;let rect=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);let paths=matched.map(i=>{let a=board.querySelector(`[data-left="${i}"]`),b=board.querySelector(`[data-right="${i}"]`);if(!a||!b)return '';let x=a.getBoundingClientRect(),y=b.getBoundingClientRect(),x1=x.right-rect.left,x2=y.left-rect.left,y1=x.top+x.height/2-rect.top,y2=y.top+y.height/2-rect.top;return `<path d="M${x1} ${y1} C${(x1+x2)/2} ${y1},${(x1+x2)/2} ${y2},${x2} ${y2}" fill="none" stroke="#13aa82" stroke-width="5" stroke-linecap="round"/>`}).join('');if(dragStart!==null&&dragPoint){let a=board.querySelector(`[data-left="${dragStart}"]`);if(a){let r=a.getBoundingClientRect(),x=r.right-rect.left,y=r.top+r.height/2-rect.top;paths+=`<path d="M${x} ${y} Q${(x+dragPoint.x)/2} ${y} ${dragPoint.x} ${dragPoint.y}" fill="none" stroke="#ef9b2b" stroke-width="5" stroke-dasharray="8 5" stroke-linecap="round"/>`}}svg.innerHTML=paths}
function startMatchDrag(e,i){if(answered||matched.includes(i)||remaining()<=0)return;e.preventDefault();dragStart=i;const board=$('#matchBoard'),r=board.getBoundingClientRect();dragPoint={x:e.clientX-r.left,y:e.clientY-r.top};drawMatchLines();window.addEventListener('pointermove',moveMatchDrag);window.addEventListener('pointerup',endMatchDrag,{once:true});window.addEventListener('pointercancel',cancelMatchDrag,{once:true})}
function moveMatchDrag(e){if(dragStart===null)return;const r=$('#matchBoard').getBoundingClientRect();dragPoint={x:e.clientX-r.left,y:e.clientY-r.top};drawMatchLines()}
function cancelMatchDrag(){dragStart=null;dragPoint=null;window.removeEventListener('pointermove',moveMatchDrag);drawMatchLines()}
function endMatchDrag(e){if(dragStart===null)return;let i=dragStart;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-right]');cancelMatchDrag();if(!target||matched.includes(Number(target.dataset.right)))return;let j=Number(target.dataset.right);if(i===j){matched.push(i);good();if(matched.length===7){score+=10;recallMode=true;recallAnswers=[];recallMisses=0;deadline=Date.now()+90*1000;timeoutHandled=false;setTimeout(()=>{if(screen==='quiz')renderQuiz()},450)}else renderQuiz()}else{penalty()}}
function renderRecall(){shell(`<div style="text-align:center;padding:18px 8px"><div style="font-size:65px">🧠✨</div><h2>Cabaran Ingatan!</h2><p class="question">Taip 3 peribahasa berbeza yang anda padankan tadi.</p><p>Jawapan tepat: <b>${recallAnswers.length}/3</b> · Masa khas: 1 minit 30 saat</p><p class="muted">Tiada petunjuk. Markah padanan yang diperoleh tidak akan hilang.</p><input id="recallInput" class="input" autocomplete="off" placeholder="Taip peribahasa penuh dalam Rumi" onkeydown="if(event.key==='Enter')checkRecall()"><div class="row" style="margin-top:16px"><button class="btn green" onclick="checkRecall()">✔ Semak Ingatan</button><button class="btn gold" onclick="finishRecall()">⏭ Tamatkan Cabaran</button></div><p class="muted">Peribahasa yang sama tidak dikira dua kali.</p></div>`)}
function checkRecall(){if(screen!=='quiz'||stage!==3||!recallMode||remaining()<=0||recallFinished)return;let val=normalize($('#recallInput')?.value||'');let found=MATCH_BANK.find(x=>normalize(x.r)===val);if(found&&!recallAnswers.includes(val)){recallAnswers.push(val);good();if(recallAnswers.length===3){finishRecall()}else{renderRecall();msg('🌟 Betul! Ingat lagi '+(3-recallAnswers.length)+' peribahasa.',true)}}else{bad();msg(found?'Peribahasa ini sudah ditaip. Cuba peribahasa lain.':'Belum tepat. Cuba ingat peribahasa lain.',false)}}
function finishRecall(){if(recallFinished||screen!=='quiz'||stage!==3||!recallMode)return;recallFinished=true;let missing=3-recallAnswers.length;let deduction=[0,2,3,5][missing];score-=deduction;unlocked[stage]=true;clearClocks();good();base(`<div style="text-align:center"><div style="font-size:70px">🧠🏆</div><h2>Cabaran Ingatan Tamat!</h2><p>Berjaya mengingati <b>${recallAnswers.length} daripada 3</b> peribahasa.</p><p>${deduction?'Penalti ingatan: −'+deduction+' markah.':'Hebat! Tiada penalti ingatan.'}</p><p>Markah daripada padanan dikekalkan.</p><button class="btn green" onclick="screen='reward';render()">🔑 Lihat Kod Rahsia</button></div>`)}
function normalize(t){return t.toLocaleLowerCase('ms').normalize('NFKC').replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim()}
function spinWheel(){if(spinning||wheelReady||answered||remaining()<=0)return;let available=[0,1,2,3,4].filter(i=>!wheelUsed.includes(i));if(!available.length)return;wheelSelected=available[Math.floor(Math.random()*available.length)];spinning=true;let btn=$('#spinBtn');btn.disabled=true;btn.textContent='🌀 Sedang berputar...';let wheel=$('#wheel');wheel.classList.add('spinning');let target=(360-(wheelSelected*72+36))%360;let current=((wheelAngle%360)+360)%360;let extra=((target-current+360)%360);wheelAngle+=1800+extra;requestAnimationFrame(()=>{wheel.style.transform=`rotate(${wheelAngle}deg)`});for(let i=0;i<8;i++)beep(400+i*40,.07,i*.12);spinTimer=setTimeout(()=>{if(screen!=='quiz'||remaining()<=0)return;spinning=false;wheelReady=true;wheel.classList.remove('spinning');btn.textContent='✅ Nombor '+(wheelSelected+1)+' terpilih';let el=$('#wheelQuestion');el.classList.remove('hidden');el.querySelector('.jawi').textContent=BANK[3][wheelSelected].j;$('#rumiInput')?.focus();good()},4300)}
function checkWheel(){if(answered||!wheelReady||remaining()<=0||wheelSelected===null)return;let val=$('#rumiInput')?.value||'';if(normalize(val)===normalize(BANK[3][wheelSelected].r)){wheelUsed.push(wheelSelected);msg('🌟 Bacaan Rumi tepat!',true);next()}else{penalty()}}
async function sendResult(){
 if(resultSent)return;
 if(!SHEETS_WEB_APP_URL.startsWith('https://script.google.com/macros/s/')){console.warn('Tetapkan URL Apps Script dahulu');return;}
 resultSent=true;
 const payload={nama:studentName,kelas:studentClass,jenis:participantType,markah:score,status:'Selesai',id:attemptId};
 try{
   // Google Apps Script redirects cross-origin POST responses; opaque means receipt cannot be verified.
   await fetch(SHEETS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true});
   console.info('Permintaan rekod markah telah dihantar; semak Google Sheets untuk pengesahan.');
 }catch(err){resultSent=false;console.error('Penghantaran markah gagal',err);}
}
function checkCode(){if($('#code').value.trim()===SECRETS.join('')){good();screen='win';stopMusic();render();sendResult()}else{bad();msg('🔒 Kod belum tepat. Semak nombor setiap misi.',false)}}function restart(){participantType='individu';studentName='';studentClass='';attemptId='';resultSent=false;clearClocks();stopMusic();SECRETS=newSecrets();screen='home';stage=0;q=0;score=0;unlocked=[false,false,false,false,false];wheelAngle=0;wheelSelected=null;wheelUsed=[];render()}render();
</script></body></html>
